services:
  openclaw-security:
    build:
      context: ../..
      dockerfile: deploy/sandbox-security/Dockerfile.openclaw
    profiles:
      - sandbox-security
    restart: "no"
    stop_signal: SIGTERM
    init: true
    user: node
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "2"
    mem_limit: 1g
    pids_limit: 256
    tmpfs:
      - /run/openclaw-security:mode=1777
      - /tmp/openclaw:mode=1777
      - /workspace:mode=1777
    networks:
      - sandbox-security-internal-audit
    environment:
      OPENCLAW_CONFIG_PATH: /opt/openclaw-general-security/config/openclaw-security.json5
      OPENCLAW_STATE_DIR: /run/openclaw-security
      SANDBOX_SECURITY_POLICY_PROFILE_ID: "${SANDBOX_SECURITY_POLICY_PROFILE_ID}"
      SANDBOX_SECURITY_PRODUCTION_MODE: "${SANDBOX_SECURITY_PRODUCTION_MODE}"
      SANDBOX_SECURITY_AUDIT_ENDPOINT: http://sandbox-security-backend:3001/internal/sandbox/security/enforcement-events
      SANDBOX_SECURITY_AUDIT_CAPABILITY_TOKEN: "${SANDBOX_SECURITY_AUDIT_CAPABILITY_TOKEN}"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          import("/opt/openclaw-general-security/dist/index.js")
          .then(({ runOpenClawSecurityRuntimeProbe }) =>
          runOpenClawSecurityRuntimeProbe({
          packageRoot: "/opt/openclaw-general-security",
          configPath: process.env.OPENCLAW_CONFIG_PATH,
          env: {
          OPENCLAW_CONFIG_PATH: process.env.OPENCLAW_CONFIG_PATH,
          OPENCLAW_STATE_DIR: process.env.OPENCLAW_STATE_DIR,
          SANDBOX_SECURITY_POLICY_PROFILE_ID: process.env.SANDBOX_SECURITY_POLICY_PROFILE_ID,
          SANDBOX_SECURITY_PRODUCTION_MODE: process.env.SANDBOX_SECURITY_PRODUCTION_MODE,
          SANDBOX_SECURITY_AUDIT_ENDPOINT: process.env.SANDBOX_SECURITY_AUDIT_ENDPOINT,
          SANDBOX_SECURITY_AUDIT_CAPABILITY_TOKEN: process.env.SANDBOX_SECURITY_AUDIT_CAPABILITY_TOKEN
          }
          }))
          .catch(() => { process.exitCode = 1; });
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s

networks:
  sandbox-security-internal-audit:
    name: sandbox-security-internal-audit
    external: true
