name: track1

networks:
  track1-public:
  track1-ingest:
    internal: true
  track1-model-egress:

services:
  openclaw-gateway:
    profiles: ["track1"]
    build:
      context: ../..
      dockerfile: deploy/track1/Dockerfile.openclaw
    environment:
      OPENCLAW_CONFIG_PATH: /app/config/openclaw.json5
      OPENCLAW_MODEL_BASE_URL: ${OPENCLAW_MODEL_BASE_URL}
      OPENCLAW_MODEL_API_KEY: ${OPENCLAW_MODEL_API_KEY}
      OPENCLAW_MODEL_ID: ${OPENCLAW_MODEL_ID}
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD}
      TRACK1_INGEST_TOKEN: ${TRACK1_INGEST_TOKEN}
      TRACK1_DEBUG_HOOKS: ${TRACK1_DEBUG_HOOKS:-}
    volumes:
      - ../../integrations/openclaw/config/openclaw.json5:/app/config/openclaw.json5:ro
      - ../../integrations/openclaw/config/agents.json5:/app/config/agents.json5:ro
    tmpfs:
      - /run/track1
      - /tmp/openclaw
      - /workspace
    networks:
      - track1-ingest
      - track1-model-egress
    command: ["gateway", "--bind", "lan", "--port", "19001"]
    healthcheck:
      test: ["CMD", "openclaw", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["track1"]
    build:
      context: ../..
      dockerfile: deploy/track1/Dockerfile.backend
    environment:
      PORT: "3000"
      INTERNAL_PORT: "3001"
      PUBLIC_BIND_HOST: "0.0.0.0"
      INTERNAL_BIND_HOST: "0.0.0.0"
      TRACK1_INGEST_TOKEN: ${TRACK1_INGEST_TOKEN}
    ports:
      - "3000:3000"
    expose:
      - "3001"
    networks:
      - track1-public
      - track1-ingest
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  campaign-runner:
    profiles: ["track1"]
    build:
      context: ../..
      dockerfile: deploy/track1/Dockerfile.runner
    network_mode: "service:openclaw-gateway"
    environment:
      OPENCLAW_CONFIG_PATH: /app/config/openclaw-runner.json5
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
      TRACK1_INGEST_TOKEN: ${TRACK1_INGEST_TOKEN}
      TRACK1_INGEST_BASE_URL: "http://backend:3001/internal/track1"
      TRACK1_BACKEND_URL: "http://backend:3000/api"
      OPENCLAW_MODEL_BASE_URL: ${OPENCLAW_MODEL_BASE_URL}
      OPENCLAW_MODEL_API_KEY: ${OPENCLAW_MODEL_API_KEY}
      OPENCLAW_MODEL_ID: ${OPENCLAW_MODEL_ID}
    tmpfs:
      - /run/track1
      - /tmp/openclaw
    depends_on:
      backend:
        condition: service_healthy
      openclaw-gateway:
        condition: service_healthy

  frontend:
    profiles: ["track1"]
    build:
      context: ../..
      dockerfile: deploy/track1/Dockerfile.frontend
    environment:
      TRACK1_BACKEND_ORIGIN: "http://backend:3000"
    ports:
      - "5173:3000"
    networks:
      - track1-public
    depends_on:
      backend:
        condition: service_healthy

  evidence-capture:
    profiles: ["evidence"]
    build:
      context: ../..
      dockerfile: deploy/track1/Dockerfile.evidence
    image: agent-security-track1-evidence:1.60.0
    environment:
      TRACK1_FRONTEND_URL: "http://frontend:3000/sandbox-alerts"
      TRACK1_EVIDENCE_INPUT: "/data/input.json"
      TRACK1_EVIDENCE_OUTPUT: "/data/screenshots"
    volumes:
      - ../../artifacts/track1:/data
    tmpfs:
      - /tmp
    networks:
      - track1-public
    depends_on:
      frontend:
        condition: service_started

  report-builder:
    profiles: ["evidence"]
    build:
      context: ../..
      dockerfile: deploy/track1/Dockerfile.report
    image: agent-security-track1-report:1
    environment:
      SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}
    volumes:
      - ../../artifacts/track1:/data
    tmpfs:
      - /tmp
    network_mode: "none"
